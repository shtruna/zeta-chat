<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZETA — Ролевой чат</title>
    <style>
        :root { --bg: #0f0f11; --surface: #1e1e24; --primary: #4f46e5; --text: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
        
        header { background: var(--surface); padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #333; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 15px 20px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; font-size: 15px;}
        .user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 2px; border: 1px solid #333;}
        
        #input-area { padding: 15px; background: var(--surface); display: flex; gap: 10px; border-top: 1px solid #333; }
        #user-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: var(--bg); color: white; resize: none; height: 60px; outline: none; }
        #user-input:focus { border-color: var(--primary); }
        button { padding: 0 25px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        button:disabled { background: #333; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>🤖 ZETA Симуляция</header>
    <div id="chat-container">
        <!-- Сюда падают сообщения -->
        <div class="message ai">Принято. Документ ZETA загружен. Я — Зо. Жду вводную: персонажа, локацию, ситуацию. Или ваш первый ход.</div>
    </div>
    <div id="input-area">
        <textarea id="user-input" placeholder="Напиши свой ход... (Enter - отправить)"></textarea>
        <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let messages = []; 

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            messages.push({ role: "user", content: text });
            
            userInput.value = '';
            sendBtn.disabled = true;

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai';
            loadingDiv.textContent = 'Зо печатает...';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages }) // systemPrompt больше не нужен, он на сервере
                });
                
                const data = await response.json();
                chatContainer.removeChild(loadingDiv); 

                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    addMessage(aiReply, 'ai');
                    messages.push({ role: "assistant", content: aiReply });
                } else {
                    addMessage("Ошибка: " + JSON.stringify(data), 'ai');
                }
            } catch (error) {
                chatContainer.removeChild(loadingDiv);
                addMessage("Ошибка сети. Проверь соединение.", 'ai');
            }
            
            sendBtn.disabled = false;
            userInput.focus();
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
